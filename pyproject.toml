[project]
name = "catt"
version = "1.0.0"
description = "CATT: controlled attribution benchmark and design-space study of LM data attribution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "torch==2.6.0",
    "transformers==5.4.0",
    "peft==0.18.1",
    "accelerate==1.13.0",
    "datasets==4.8.4",
    "huggingface-hub==1.8.0",
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    "protobuf==6.33.6",
    "numpy>=1.26.4,<2.7",
    "scipy==1.17.1",
    "rank-bm25==0.2.2",
    # torch.einsum picks its contraction order with opt_einsum when it is
    # installed; the published scores were computed with it.
    "opt-einsum==3.4.0",
    "tqdm",
]

[project.optional-dependencies]
# The CUDA kernel behind the dense TRAK job, compiled
# against the venv's own torch, so its build tools go in first (see
# scripts/install_fast_jl.sh; needs a CUDA 12.x nvcc, ideally torch's 12.4).
build = ["setuptools", "wheel", "ninja"]
jl = ["fast-jl==0.1.3", "setuptools", "wheel", "ninja"]

[project.scripts]
catt = "catt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catt"]

[tool.uv]
index-strategy = "unsafe-best-match"
no-build-isolation-package = ["fast-jl"]
python-preference = "only-managed"

[[tool.uv.dependency-metadata]]
name = "fast-jl"
version = "0.1.3"
requires-dist = ["torch"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
